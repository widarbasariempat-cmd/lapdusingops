<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Halaman tidak ditemukan</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #181818;
        background: #eeeae5;
        font: 16px/1.5 Arial, Helvetica, sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 520px);
        padding: 32px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 4px 20px #00000014;
      }
      h1 { margin: 0 0 12px; color: #245c3b; }
      p { margin: 0 0 20px; }
      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 6px;
        color: #fff;
        background: #245c3b;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #181818; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Halaman tidak ditemukan</h1>
      <p>Alamat yang Anda buka tidak tersedia. Anda akan diarahkan kembali ke halaman utama.</p>
      <p><a id="home-link" href="./">Kembali ke halaman utama</a></p>
    </main>
    <script>
      // GitHub Pages project sites live under /<repository>/; custom domains use /.
      const isGitHubProjectSite = location.hostname.endsWith(".github.io");
      const firstPathSegment = location.pathname.split("/").filter(Boolean)[0];
      const homeUrl = isGitHubProjectSite && firstPathSegment
        ? `/${firstPathSegment}/`
        : "/";
      document.getElementById("home-link").href = homeUrl;
      window.setTimeout(() => location.replace(homeUrl), 3000);
    </script>
  </body>
</html>
